name: Set up Kubhexa Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubhexa-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: dqpxsjeeqoadogoadyts
      KUBHEXA_ALLOWED_ORIGINS: https://edubonke.github.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Check that the project administrator configured credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo 'Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in repository Actions secrets before running this setup.'
            exit 1
          fi
      - name: Link the selected project
        run: npx --yes supabase@2.121.0 link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply the namespaced enquiry migration
        run: npx --yes supabase@2.121.0 db push --linked
      - name: Allow the GitHub Pages browser origin
        run: npx --yes supabase@2.121.0 secrets set KUBHEXA_ALLOWED_ORIGINS="$KUBHEXA_ALLOWED_ORIGINS" --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy the public enquiry function
        run: npx --yes supabase@2.121.0 functions deploy kubhexa-enquiries --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: Check the deployed function's browser-origin response
        run: node scripts/check-enquiry-endpoint.mjs
