name: Browser QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check && pnpm test && pnpm build
      - name: Install the isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/kubhexa-browser" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/kubhexa-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test the built website in Chromium
        run: NODE_PATH="$RUNNER_TEMP/kubhexa-browser/node_modules" node scripts/browser-qa.cjs
      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubhexa-browser-screenshots
          path: browser-qa-output/
          if-no-files-found: ignore
